<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F7F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="P&amp;L Calendar">
<title>P&amp;L Calendar</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7F5; --card:#FFFFFF; --line:#E4E4E0; --line2:#D6D6D1; --soft:#ECECE8; --soft2:#F1F1EE;
  --ink:#16181D; --ink2:#3A3F48; --muted:#5B606B; --faint:#8A909B;
  --green:#0B7A43; --red:#B3261E;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:var(--mono)}
.g{color:var(--green)} .r{color:var(--red)} .mu{color:var(--muted)}
.wrap{max-width:480px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 0 120px}

/* top */
.top{display:flex;gap:8px;padding:4px 16px 10px;align-items:center}
.tabs{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--soft);border-radius:12px;padding:4px}
.tab{height:42px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:600;font-size:14px}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.iconbtn{width:44px;height:44px;border:0;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0}
.banner{margin:0 16px 10px;padding:9px 12px;border-radius:10px;background:#FFF4E5;color:#7A4100;font-size:12px;line-height:1.4}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.cap{margin:0 16px;padding:14px 16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cap .l{font-size:11px;color:var(--muted);font-weight:500}
.cap .v{font-family:var(--mono);font-size:14px;font-weight:600;margin-top:3px;word-break:break-all}
.cap .p{font-family:var(--mono);font-size:11px;font-weight:600;margin-top:1px}
.capnote{display:block;margin:6px 16px 0;font-size:12px;color:var(--muted)}
.money{margin:0 16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;width:calc(100% - 32px);text-align:left;color:var(--ink)}
.money .top2{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.money .lbl{font-size:12px;color:var(--muted);font-weight:500}
.money .now{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.money .chg{font-family:var(--mono);font-size:14px;font-weight:600;text-align:right}
.money .chg small{display:block;font-size:11px;font-weight:600}
.mrows{display:flex;flex-direction:column;gap:6px;border-top:1px solid #EFEFEB;padding-top:10px}
.mrow{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;gap:8px}
.mrow span:first-child{color:var(--ink2)}
.mrow .mono{font-weight:600}
.mrow.total{border-top:1px dashed var(--line2);padding-top:7px;font-weight:700}
.mrow.total span:first-child{color:var(--ink)}
.mhint{font-size:11px;color:var(--muted)}
.pwwrap{position:relative}
.pwwrap .in{padding-right:52px}
.eye{position:absolute;right:2px;top:2px;width:44px;height:40px;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center}
.setcap{margin:0 16px;width:calc(100% - 32px);height:52px;border:1.5px dashed var(--faint);border-radius:16px;background:#fff;font-weight:600;font-size:14px}

.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:12px 16px 2px}
.chip{height:40px;border-radius:20px;border:1px solid #E0E0DB;background:#fff;color:var(--ink2);font-weight:600;font-size:13px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.subs{display:flex;gap:6px;padding:8px 16px 0;overflow-x:auto;scrollbar-width:none}
.subs::-webkit-scrollbar{display:none}
.sub{flex-shrink:0;height:34px;padding:0 12px;border-radius:8px;border:1px solid #E0E0DB;background:transparent;color:var(--ink2);font-weight:600;font-size:12px}
.sub.on{background:#EAF0FF;color:#2948A8;border-color:#9DB2EE}

.mnav{display:flex;align-items:center;justify-content:space-between;padding:16px 8px 12px}
.mnav .navb{width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.mnav .navb:disabled{color:#C3C6CC;cursor:default}
.mnav .mid{display:flex;flex-direction:column;align-items:center;gap:1px}
.mnav .mt{font-size:15px;font-weight:600}
.mnav .ms{font-family:var(--mono);font-size:12px;font-weight:600}

.cal{padding:0 16px;display:flex;flex-direction:column;gap:5px}
.row5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.dow{font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding-bottom:2px}
.cell{position:relative;height:60px;width:100%;border:0;border-radius:10px;padding:7px 8px 8px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left}
.cell .d{font-size:13px;font-weight:600}
.cell .a{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:-.03em;white-space:nowrap}
.cell.out{background:transparent;color:#C3C6CC;cursor:default}
.cell.none{background:var(--soft);color:var(--muted)}
.cell.future{background:var(--soft2);color:#A3A8B1;cursor:default}
.cell.today{background:#fff;color:var(--ink);border:1.5px dashed var(--faint)}
.cell.sel{outline:2px solid var(--ink);outline-offset:1px}
.cell .dot{position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:3px;background:currentColor}

.legend{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:14px;padding:12px 16px 0;font-size:11px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}

.bw{margin:16px 16px 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bwc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left}
.bwc .h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.bwc .amt{font-family:var(--mono);font-size:18px;font-weight:600}
.bwc .dt{font-size:12px;color:var(--muted)}
.stats{margin:8px 16px 0;padding:12px 14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats .l{font-size:11px;color:var(--muted)} .stats .v{font-size:16px;font-weight:700;margin-top:3px}
.foot{display:block;margin:10px 16px 0;font-size:11px;color:var(--muted);line-height:1.4}

.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));right:max(16px,calc((100vw - 480px)/2 + 16px));width:60px;height:60px;border-radius:18px;border:0;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.22);z-index:20;transition:transform .15s}
.fab.open{transform:rotate(45deg)}
.menu{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));right:max(16px,calc((100vw - 480px)/2 + 16px));display:flex;flex-direction:column;gap:8px;align-items:flex-end;z-index:21}
.mi{height:50px;padding:0 16px;border-radius:14px;border:1px solid #E0E0DB;background:#fff;font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.12)}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(22,24,29,.35);z-index:30;display:flex;flex-direction:column;justify-content:flex-end}
.ov.clear{background:rgba(22,24,29,.12)}
.ov .bd{flex:1;border:0;background:transparent}
.sheet{width:100%;max-width:480px;margin:0 auto;background:#fff;border-radius:22px 22px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow-y:auto}
.sheet>*{flex-shrink:0}
.grab{width:40px;height:4px;border-radius:2px;background:#D6D6D1;align-self:center}
.sh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.sh .t{font-size:18px;font-weight:700}
.sh .s{font-size:13px;color:var(--muted);font-weight:500}
.big{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.02em}
.hint{font-size:12px;color:var(--muted)}
.note{display:flex;gap:8px;align-items:flex-start;background:#F4F4F1;border-radius:12px;padding:10px 12px;font-size:12px;color:var(--ink2);line-height:1.4}
.note .nd{width:6px;height:6px;border-radius:3px;background:var(--ink);margin-top:5px;flex-shrink:0}
.note.ok{background:#EAF7EF;color:#064D2A}
.note.warn{background:#FFF4E5;color:#7A4100}
.grp{display:flex;flex-direction:column;gap:6px}
.gh{display:flex;align-items:center;justify-content:space-between}
.tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:7px}
.tag.day{background:#EAF0FF;color:#2948A8} .tag.swing{background:#F3ECFF;color:#5B2DA6}
.tr{border:1px solid var(--soft);border-radius:12px;display:flex;flex-direction:column}
.tr.open{border-color:var(--ink)}
.trb{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border:0;background:transparent;text-align:left}
.trb .sym{font-size:14px;font-weight:600}
.trb .meta{font-size:12px;color:var(--muted);margin-top:2px}
.trb .det{font-family:var(--mono);font-size:12px;color:var(--ink2);margin-top:2px}
.trb .pl{font-family:var(--mono);font-size:14px;font-weight:600;white-space:nowrap}
.tra{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 12px 12px}
.btn{height:50px;border-radius:14px;border:0;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px}
.btn.sm{height:44px;border-radius:10px;font-size:14px;font-weight:600}
.btn.dark{background:var(--ink);color:#fff}
.btn.dark:disabled{opacity:.5}
.btn.ghost{background:#fff;border:1px solid var(--line2);color:var(--ink)}
.btn.danger{background:#FFF6F5;border:1px solid #F0C4BF;color:#A1231B}
.btn.dangerfill{background:#B3261E;color:#fff}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:8px}
.half{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--ink2);min-width:0}
.in{height:44px;width:100%;min-width:0;border:1px solid var(--line2);border-radius:10px;padding:0 10px;font-size:15px;background:#fff}
.in.mono{font-family:var(--mono);font-size:14px}
.in.warn{border:2px solid #D97706;background:#FFF8EB}
select.in{padding-right:4px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--soft);border-radius:12px;padding:4px}
.flist{display:flex;flex-direction:column;gap:6px}
.frow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border:1px solid var(--soft);border-radius:12px;font-size:13px}
.xbtn{width:36px;height:36px;border:0;border-radius:10px;background:var(--soft2);display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}

/* full screen check */
.full{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column}
.full .in-wrap{width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0}
.fhead{display:flex;align-items:center;gap:4px;padding:calc(12px + env(safe-area-inset-top)) 8px 6px}
.fbody{flex:1;overflow-y:auto;padding:8px 16px 20px;display:flex;flex-direction:column;gap:10px}
.ffoot{padding:12px 16px calc(16px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.file{display:flex;align-items:center;gap:10px;padding:12px}
.thumb{width:48px;height:60px;border-radius:8px;background:var(--soft);object-fit:cover;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.crow{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.crow.flag{border-color:#F2C27B}
.crow.dup{opacity:.55}
.crow .top1{display:flex;gap:6px;align-items:flex-end}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.crow .pl{font-family:var(--mono);font-weight:600;font-size:14px}
.warnt{font-size:12px;font-weight:600;color:#8A4B00}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--soft);border-top-color:var(--ink);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.center{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 0;color:var(--muted);font-size:14px;text-align:center}

/* login */
.login{max-width:400px;margin:0 auto;padding:calc(60px + env(safe-area-inset-top)) 20px 40px;display:flex;flex-direction:column;gap:14px}
.login h1{margin:0;font-size:28px;letter-spacing:-.02em}
.err{color:var(--red);font-size:13px;font-weight:500}

/* ---- small screens: short amounts; bigger screens: full amounts ---- */
.cell .af,.cell .n{display:none}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--soft);border-radius:12px;background:#fff;text-align:left;width:100%}
.rrow .rl,.rrow .rr{display:flex;flex-direction:column;gap:3px}.rrow .rr{align-items:flex-end}
.rrow b{font-size:15px}
.linkbtn{border:0;background:transparent;padding:0 0 4px;color:var(--muted);font-size:13px;font-weight:600;display:flex;align-items:center;gap:2px;min-height:32px}
.dtab{display:flex;flex-direction:column;border:1px solid var(--soft);border-radius:12px;overflow:hidden}
.dh,.dr{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.6fr) minmax(0,1.1fr) minmax(0,1.2fr);gap:6px;padding:9px 12px;font-size:13px;align-items:center;text-align:left}
.dh{background:var(--soft2);font-size:11px;font-weight:700;color:var(--muted)}
.dr{border:0;border-top:1px solid var(--soft);background:#fff;width:100%}
.dh span:nth-child(n+2),.dr span:nth-child(n+2){text-align:right}
.pastehint{display:none;text-align:center;font-size:12px;color:var(--muted);padding-top:10px}
@media (hover:hover) and (pointer:fine){.pastehint{display:block}}
/* ---- tablets / small laptops ---- */
@media (min-width:600px){
  .wrap{max-width:720px}
  .cell{height:84px;padding:9px 10px}
  .cell .d{font-size:14px}
  .cell .a{font-size:14px}
  .cell .as{display:none} .cell .af{display:inline}
  .cell .n{display:block;font-size:11px;font-weight:500;opacity:.8}
  .row5,.cal{gap:7px}
  .fab{right:max(24px,calc((100vw - 720px)/2 + 16px))}
  .menu{right:max(24px,calc((100vw - 720px)/2 + 16px))}
  .ov{justify-content:center;align-items:center;padding:24px}
  .ov .bd{position:absolute;inset:0}
  .sheet{position:relative;border-radius:20px;max-width:560px;max-height:86vh;padding-bottom:24px}
  .grab{display:none}
  .full .in-wrap{max-width:760px}
}
/* ---- laptops (13" and up): two columns, calendar fills the screen ---- */
@media (min-width:1000px){
  .wrap{max-width:1440px;padding:24px 32px 48px;display:grid;grid-template-columns:minmax(330px,390px) minmax(0,1fr);grid-template-areas:"l r" "l2 r";grid-template-rows:auto 1fr;column-gap:28px;align-items:start}
  .colL{grid-area:l} .colL2{grid-area:l2;padding-bottom:90px}
  .colR{grid-area:r;background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 22px 20px;position:sticky;top:24px}
  .colL .top,.colL .chips,.colL .subs,.colL2 .foot{padding-left:0;padding-right:0;margin-left:0;margin-right:0}
  .colL .banner,.colL .money,.colL .setcap,.colL2 .bw,.colL2 .stats{margin-left:0;margin-right:0;width:100%}
  .colR .cal,.colR .legend{padding-left:0;padding-right:0}
  .mnav{padding:14px 0 14px}
  .mnav .mt{font-size:20px} .mnav .ms{font-size:14px}
  .dow{font-size:13px}
  .cell{height:clamp(84px,calc((100vh - 250px) / 6),132px);padding:10px 12px;border-radius:12px}
  .cell .d{font-size:15px}
  .cell .a{font-size:17px;letter-spacing:-.02em}
  .cell .n{font-size:12px}
  .cell .dot{top:10px;right:10px;width:7px;height:7px}
  .row5,.cal{gap:8px}
  .fab{right:32px;bottom:32px}
  .menu{right:32px;bottom:104px}
}
@media (min-width:1400px){
  .cell .a{font-size:19px}
}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:60;display:none;align-items:center;gap:14px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
#toast button{border:0;background:transparent;color:#8FD3AE;font-weight:700;font-size:14px;padding:4px}
</style>
</head>
<body>
<div id="main"></div>
<div id="overlay"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileSS" accept="image/*" hidden>
<input type="file" id="filePDF" accept="application/pdf,.pdf" hidden>
<input type="file" id="fileStmt" accept="application/pdf,.pdf,.xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" hidden>
<input type="file" id="fileFunds" accept="image/*,application/pdf,.pdf,.xlsx,.xls,.csv" hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="config.js"></script>
<script>
(function () {
'use strict';

/* ---------------- setup ---------------- */
var CFG = window.APP_CONFIG || {};
var PEOPLE = ['Ranjith', 'Chandana'];
var SHADE_MID = CFG.SHADE_MID || 1000, SHADE_HIGH = CFG.SHADE_HIGH || 2500;
var CONN_KEY = 'pnlcal.conn';
// Connection details come from (1) a setup link, (2) this phone, or (3) config.js
(function readSetupLink() {
  var m = location.hash.match(/setup=([^&]+)/);
  if (!m) return;
  try {
    var c = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
    if (c && c.u && c.k) localStorage.setItem(CONN_KEY, JSON.stringify({ u: c.u, k: c.k }));
  } catch (e) { }
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { }
})();
function getConn() {
  var c = null;
  try { c = JSON.parse(localStorage.getItem(CONN_KEY) || 'null'); } catch (e) { }
  if (c && c.u && c.k) return c;
  if (CFG.SUPABASE_URL && CFG.SUPABASE_URL.indexOf('YOUR-PROJECT') < 0 && CFG.SUPABASE_ANON_KEY && CFG.SUPABASE_ANON_KEY.indexOf('YOUR-') < 0)
    return { u: CFG.SUPABASE_URL, k: CFG.SUPABASE_ANON_KEY };
  return null;
}
var CONN = getConn();
var sb = (CONN && window.supabase) ? window.supabase.createClient(CONN.u, CONN.k, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
}) : null;
if (window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

var SUBS = [['all', 'All'], ['nifty', 'Nifty'], ['sensex', 'Sensex'], ['banknifty', 'BankNifty'], ['stockopt', 'Stock options'], ['stocks', 'Stocks']];

var TYPES = [['day:nifty', 'Day · Nifty'], ['day:sensex', 'Day · Sensex'], ['day:banknifty', 'Day · BankNifty'],

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pad(n) { return String(n).padStart(2, '0'); }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

function parseD(s) { var p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function validDate(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || '')); }
function fmtDay(s) { var d = parseD(s); return DOW[d.getDay()] + ', ' + d.getDate() + ' ' + MON[d.getMonth()]; }
function num(v) { if (v === '' || v == null) return 0; var n = Number(String(v).replace(/[,₹\s]/g, '')); return isFinite(n) ? n : 0; }
function numOrNull(v) { if (v === '' || v == null) return null; var n = Number(String(v).replace(/[,₹\s]/g, '')); return isFinite(n) ? n : null; }
function r2(v) { return Math.round(v * 100) / 100; }
function sgn(v) { v = Math.round(v); return v > 0 ? '+' : v < 0 ? '−' : ''; }
function inr(v) { return '₹' + Math.abs(Math.round(v)).toLocaleString('en-IN'); }
function money(v) { return sgn(v) + inr(v); }
function short(v) {
  var a = Math.abs(v), s;
  if (a >= 100000) s = (a / 100000).toFixed(a >= 1000000 ? 0 : 1) + 'L';
  else if (a >= 1000) s = (a / 1000).toFixed(a >= 10000 ? 0 : 1) + 'k';
  else s = String(Math.round(a));
  return sgn(v) + s;
}
function px(v) { return v == null || v === '' ? '' : Number(v).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function net(t) { return num(t.pnl) - num(t.charges); }
function col(v) { return Math.round(v) > 0 ? 'g' : Math.round(v) < 0 ? 'r' : 'mu'; }
function lsGet(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }

/* ---------------- toast ---------------- */
var toastTimer = null;
function toast(msg, actionLabel, action, ms) {
  var el = $('toast');
  el.innerHTML = '<span>' + esc(msg) + '</span>' + (actionLabel ? '<button type="button" id="toastBtn">' + esc(actionLabel) + '</button>' : '');
  el.style.display = 'flex';
  if (actionLabel) $('toastBtn').onclick = function () { el.style.display = 'none'; action(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.style.display = 'none'; }, ms || (actionLabel ? 6000 : 3000));
}

/* ---------------- cache (data stays visible after closing the app) ---------------- */
var CACHE_KEY = 'pnlcal.cache.v1';
function saveCache() { lsSet(CACHE_KEY, { trades: S.trades, funds: S.funds, settings: S.settings, uploads: S.uploads, ai: S.ai, at: Date.now() }); }
function loadCache() {
  var c = lsGet(CACHE_KEY);
  if (!c) return;
  S.trades = c.trades || []; S.funds = c.funds || []; S.settings = c.settings || {}; S.uploads = c.uploads || {}; S.ai = c.ai || S.ai;
  S.lastSync = c.at || null; S.loaded = true;
}

/* ---------------- data sync ---------------- */
async function fetchAll(makeQuery) {
  var out = [], from = 0;
  for (;;) {
    var res = await makeQuery().range(from, from + 999);
    if (res.error) throw res.error;
    out = out.concat(res.data || []);
    if (!res.data || res.data.length < 1000) break;
    from += 1000;
  }
  return out;
}
async function loadAll() {
  if (!sb || !S.session) return;
  S.syncing = true;
  try {
    var r = await Promise.all([
      fetchAll(function () { return sb.from('trades').select('*').is('deleted_at', null).order('trade_date').order('created_at'); }),
      fetchAll(function () { return sb.from('funds').select('*').order('fund_date'); }),
      fetchAll(function () { return sb.from('settings').select('*'); }),
      fetchAll(function () { return sb.from('uploads').select('id,kind,path,file_name,profile'); }),
      fetchAll(function () { return sb.from('app_config').select('*'); })
    ]);
    var ac = r[4][0] || {};
    S.ai = { key: ac.gemini_key || '', model: ac.gemini_model || '' };
    S.trades = r[0]; S.funds = r[1];
    S.settings = {}; r[2].forEach(function (s) { S.settings[s.profile] = s; });
    S.uploads = {}; r[3].forEach(function (u) { S.uploads[u.id] = u; });
    S.loaded = true; S.lastSync = Date.now(); S.online = true;
    saveCache();
  } catch (e) {
    S.online = navigator.onLine;
    if (navigator.onLine) toast('Could not sync: ' + (e.message || 'error'));
  }
  S.syncing = false;
  render();
  if (S.sheet && S.sheet.type !== 'check' && S.sheet.type !== 'add') renderSheet();
}
var reloadTimer = null;
function queueReload() { clearTimeout(reloadTimer); reloadTimer = setTimeout(loadAll, 350); }
function subscribe() {
  if (S.chan || !sb) return;
  S.chan = sb.channel('pnl-sync')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'trades' }, queueReload)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'funds' }, queueReload)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'settings' }, queueReload)
    .subscribe();
}
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && S.session) loadAll(); });
window.addEventListener('online', function () { S.online = true; if (S.session) loadAll(); });
window.addEventListener('offline', function () { S.online = false; render(); });

/* ---------------- calculations ---------------- */
function passes(t) {
  if (S.top === 'all') return true;
  if (t.category !== S.top) return false;
  if (S.top === 'day' && S.sub !== 'all') return t.sub === S.sub;
  return true;
}
function mine() { return S.trades.filter(function (t) { return t.profile === S.who; }); }
function mkey(y, m) { return y + '-' + pad(m + 1); }
function monthName(y, m) { return MONTH[m] + ' ' + y; }
// Money for one month: opening (carried forward) + funds in month + trading P&L in month = closing.
function moneyFor(who, y, m) {
  var st = S.settings[who], start = st ? num(st.start_capital) : 0;
  var from = mkey(y, m) + '-01', to = ymd(new Date(y, m + 1, 1));
  var funds = S.funds.filter(function (f) { return f.profile === who; });
  var trades = S.trades.filter(function (t) { return t.profile === who; });
  var o = { start: start, opening: start, added: 0, withdrawn: 0, gross: 0, charges: 0, net: 0, trades: [], funds: [], hasBefore: false };
  funds.forEach(function (f) {
    var a = num(f.amount);
    if (f.fund_date < from) { o.opening += a; o.hasBefore = true; }
    else if (f.fund_date < to) { if (a >= 0) o.added += a; else o.withdrawn += -a; o.funds.push(f); }
  });
  trades.forEach(function (t) {
    if (t.trade_date < from) { o.opening += net(t); o.hasBefore = true; }
    else if (t.trade_date < to) { o.gross += num(t.pnl); o.charges += num(t.charges); o.trades.push(t); }
  });
  o.net = o.gross - o.charges;
  o.closing = o.opening + o.added - o.withdrawn + o.net;
  o.base = o.opening + o.added;
  o.pct = o.base > 0 ? o.net / o.base * 100 : 0;
  var days = {}; o.trades.forEach(function (t) { days[t.trade_date] = (days[t.trade_date] || 0) + net(t); });
  o.green = 0; o.red = 0; Object.keys(days).forEach(function (d) { if (Math.round(days[d]) > 0) o.green++; else if (Math.round(days[d]) < 0) o.red++; });
  return o;
}
function firstMonth(who) {
  var ds = [];
  S.trades.forEach(function (t) { if (t.profile === who) ds.push(t.trade_date); });
  S.funds.forEach(function (f) { if (f.profile === who) ds.push(f.fund_date); });
  if (!ds.length) return null;
  ds.sort(); var d = parseD(ds[0]); return { y: d.getFullYear(), m: d.getMonth() };
}
function dayMap(list) {
  var m = {};
  list.forEach(function (t) {
    var k = t.trade_date;
    if (!m[k]) m[k] = { net: 0, approx: false, list: [] };
    m[k].net += net(t); if (t.approx) m[k].approx = true; m[k].list.push(t);
  });
  return m;
}
function tone(v) {
  var a = Math.abs(v);
  if (v >= 0) return a >= SHADE_HIGH ? ['#0E8A4F', '#FFFFFF'] : a >= SHADE_MID ? ['#A8DDBE', '#064D2A'] : ['#E3F4EA', '#0B6B3B'];
  return a >= SHADE_HIGH ? ['#C8372D', '#FFFFFF'] : a >= SHADE_MID ? ['#F4B9B1', '#7A140E'] : ['#FBE6E3', '#A1231B'];
}

/* ---------------- main screen ---------------- */
function render() {
  if (!S.session) return;
  var all = mine(), vis = all.filter(passes);
  var dm = dayMap(vis), dmAll = dayMap(all);
  var today = todayStr();

  var st = S.settings[S.who];
  var start = st ? num(st.start_capital) : 0;
  var fundsTot = S.funds.filter(function (f) { return f.profile === S.who; }).length;
  var M = moneyFor(S.who, S.y, S.m);
  var isNow = S.y === now0.getFullYear() && S.m === now0.getMonth();
  var pm = S.m ? S.m - 1 : 11, py = S.m ? S.y : S.y - 1;

  var h = '<div class="wrap"><div class="colL">';
  h += '<div class="top"><div class="tabs" role="tablist">' + PEOPLE.map(function (p) {
    return '<button type="button" role="tab" aria-selected="' + (p === S.who) + '" class="tab' + (p === S.who ? ' on' : '') + '" data-act="who" data-v="' + esc(p) + '">' + esc(p) + '</button>';
  }).join('') + '</div><button type="button" class="iconbtn" data-act="settings" aria-label="Settings">' + ICON.gear + '</button></div>';

  if (!S.online) h += '<div class="banner">You\'re offline. Showing your saved data — new changes need internet.</div>';
  if (S.lastSync && !Object.keys(S.settings).length) h += '<div class="banner">This login can\'t see any data. Only the first two logins created in Supabase are allowed — see README "If something goes wrong".</div>';

  if (S.lastSync && !S.ai.key) h += '<button type="button" class="banner" data-act="settings" style="display:block;width:calc(100% - 32px);border:0;text-align:left">One step left: tap here and paste your Gemini key so the app can read screenshots and PDFs.</button>';
  if (!start && !fundsTot) {
    h += '<button type="button" class="setcap" data-act="settings">+ Set ' + esc(S.who) + '\'s starting capital</button>';
  } else {
    var pct = M.base > 0 ? sgn(M.net) + Math.abs(M.pct).toFixed(2) + '%' : '';
    var cl = (M.closing < 0 ? '−' : '') + inr(M.closing);
    h += '<button type="button" class="card money" data-act="funds" aria-label="Money summary for ' + monthName(S.y, S.m) + ', tap to add or withdraw funds">' +
      '<div class="top2"><div><div class="lbl">' + (isNow ? 'Money left now' : 'Money left at end of ' + MONTH[S.m]) + '</div><div class="now">' + cl + '</div></div>' +
      '<div class="chg ' + col(M.net) + '">' + money(M.net) + '<small>' + pct + ' ' + MONTH[S.m].slice(0, 3) + ' P&amp;L</small></div></div>' +
      '<div class="mrows">' +
      '<div class="mrow"><span>' + (M.hasBefore ? 'Carried from ' + MONTH[pm] + ' ' + py : 'Starting capital') + '</span><span class="mono">' + (M.opening < 0 ? '−' : '') + inr(M.opening) + '</span></div>' +
      '<div class="mrow"><span>Funds added</span><span class="mono g">' + (M.added ? '+' + inr(M.added) : '₹0') + '</span></div>' +
      '<div class="mrow"><span>Funds withdrawn</span><span class="mono' + (M.withdrawn ? ' r' : '') + '">' + (M.withdrawn ? '−' + inr(M.withdrawn) : '₹0') + '</span></div>' +
      '<div class="mrow"><span>' + MONTH[S.m] + ' trading P&amp;L <span class="mhint">(gross ' + money(M.gross) + ' − charges ' + inr(M.charges) + ')</span></span><span class="mono ' + col(M.net) + '">' + money(M.net) + '</span></div>' +
      '<div class="mrow total"><span>' + (isNow ? 'Money left now' : 'Closing — carried to ' + MONTH[(S.m + 1) % 12]) + '</span><span class="mono">' + cl + '</span></div>' +
      '</div><span class="mhint">Each month starts from the money left last month · tap to add / withdraw funds</span></button>';
  }

  h += '<div class="chips">' + [['all', 'All'], ['day', 'Day trading'], ['swing', 'Swing']].map(function (c) {
    return '<button type="button" class="chip' + (S.top === c[0] ? ' on' : '') + '" data-act="top" data-v="' + c[0] + '">' + c[1] + '</button>';
  }).join('') + '</div>';
  if (S.top === 'day') h += '<div class="subs">' + SUBS.map(function (c) {
    return '<button type="button" class="sub' + (S.sub === c[0] ? ' on' : '') + '" data-act="sub" data-v="' + c[0] + '">' + c[1] + '</button>';
  }).join('') + '</div>';

  // month grid (Mon–Fri)
  var y = S.y, m = S.m, last = new Date(y, m + 1, 0);
  var d = new Date(y, m, 1);
  while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
  d.setDate(d.getDate() - (d.getDay() - 1));
  var rows = [], monthTot = 0, hi = null, lo = null, gN = 0, rN = 0, anyApprox = false;
  while (d <= last) {
    var row = [];
    for (var i = 0; i < 5; i++) {
      var key = ymd(d), inM = d.getMonth() === m, v = dm[key], cls, inner, act = '', aria;
      var label = '<span class="d">' + d.getDate() + '</span>';
      if (!inM) { cls = 'out'; inner = label; aria = fmtDay(key); }
      else if (v) {
        var t = tone(v.net);
        monthTot += v.net;
        if (Math.round(v.net) > 0) gN++; else if (Math.round(v.net) < 0) rN++;
        if (!hi || v.net > hi.v) hi = { d: key, v: v.net };
        if (!lo || v.net < lo.v) lo = { d: key, v: v.net };
        if (v.approx) anyApprox = true;
        cls = (S.sheet && S.sheet.type === 'day' && S.sheet.date === key) ? 'sel' : '';
        inner = (v.approx ? '<span class="dot"></span>' : '') + label + '<span class="a"><span class="as">' + short(v.net) + '</span><span class="af">' + money(v.net) + '</span></span>' +
          '<span class="n">' + v.list.length + ' trade' + (v.list.length === 1 ? '' : 's') + '</span>';
        act = 'day'; aria = fmtDay(key) + ', ' + (v.net >= 0 ? 'profit ' : 'loss ') + inr(v.net) + (v.approx ? ', approximate' : '');
        cls += '" style="background:' + t[0] + ';color:' + t[1];
      }
      else if (key === today) { cls = 'today'; inner = label + '<span class="a">+ Add</span>'; act = 'add'; aria = 'Today, add trades'; }
      else if (key > today) { cls = 'future'; inner = label; aria = fmtDay(key); }
      else { cls = 'none'; inner = label + '<span class="a">—</span>'; act = 'day'; aria = fmtDay(key) + (dmAll[key] ? ', no trades in this filter' : ', no trades'); }
      row.push('<button type="button" class="cell ' + cls + '"' + (act ? ' data-act="' + act + '" data-date="' + key + '"' : ' tabindex="-1"') + ' aria-label="' + esc(aria) + '">' + inner + '</button>');
      d.setDate(d.getDate() + 1);
    }
    d.setDate(d.getDate() + 2);

function daySheet(date) {
  var list = mine().filter(function (t) { return t.trade_date === date; });
  var h = '';
  var tot = list.reduce(function (a, t) { return a + net(t); }, 0);
  var gross = list.reduce(function (a, t) { return a + num(t.pnl); }, 0);
  var ch = list.reduce(function (a, t) { return a + num(t.charges); }, 0);
  h += '<div class="sh"><div><div class="s">' + esc(S.who) + ' · ' + fmtDay(date) + '</div><div class="big ' + col(tot) + '">' + (list.length ? money(tot) : '₹0') + '</div>' +
    (list.length ? '<div class="hint">Gross ' + money(gross) + ' · Charges ' + inr(ch) + '</div>' : '') + '</div>' + closeBtn() + '</div>';
  if (!list.length) return h + '<span class="hint" style="padding:6px 0 14px;font-size:14px">No trades on this day.</span>';
  if (list.some(function (t) { return t.approx; })) h += '<div class="note"><span class="nd"></span><span>From a screenshot. Charges are estimated for your broker; add this week\'s contract note PDF to make them exact.</span></div>';
  h += '<span class="hint">Tap a trade to edit or delete it.</span>';
  [['day', 'Day trading'], ['swing', 'Swing']].forEach(function (g) {
    var gl = list.filter(function (t) { return t.category === g[0]; });
    if (!gl.length) return;
    var gt = gl.reduce(function (a, t) { return a + net(t); }, 0);
    h += '<div class="grp"><div class="gh"><span class="tag ' + g[0] + '">' + g[1] + '</span><span class="mono ' + col(gt) + '" style="font-size:13px;font-weight:600">' + money(gt) + '</span></div>';
    gl.forEach(function (t) {
      var open = S.openTrade === t.id, v = net(t);
      var det = [];
      if (t.qty != null) det.push('Qty ' + Number(t.qty).toLocaleString('en-IN'));
      if (t.buy != null && t.sell != null) det.push(px(t.buy) + ' → ' + px(t.sell));
      if (num(t.charges)) det.push('chg ' + inr(t.charges));
      h += '<div class="tr' + (open ? ' open' : '') + '"><button type="button" class="trb" data-act="tt" data-id="' + t.id + '" aria-expanded="' + open + '">' +
        '<span><span class="sym" style="display:block">' + esc(t.symbol || '—') + '</span><span class="meta" style="display:block">' + typeLabel(t) + (t.source === 'pdf' ? ' · from PDF' : t.source === 'ss' ? ' · from screenshot' : '') + '</span>' +
        (det.length ? '<span class="det" style="display:block">' + esc(det.join(' · ')) + '</span>' : '') + '</span>' +
        '<span class="pl ' + col(v) + '">' + money(v) + '</span></button>' +
        (open ? '<div class="tra"><button type="button" class="btn sm ghost" data-act="edit" data-id="' + t.id + '">' + ICON.edit + 'Edit</button>' +
          '<button type="button" class="btn sm danger" data-act="del" data-id="' + t.id + '">' + ICON.trash + 'Delete</button></div>' : '') + '</div>';
    });
    h += '</div>';
  });
  var ups = {};
  list.forEach(function (t) { if (t.upload_id && S.uploads[t.upload_id]) ups[t.upload_id] = S.uploads[t.upload_id]; });
  var uk = Object.keys(ups);
  if (uk.length) h += '<div class="half">' + uk.map(function (id) {
    return '<button type="button" class="btn sm ghost" data-act="viewUp" data-id="' + id + '">' + (ups[id].kind === 'pdf' ? ICON.pdf + 'View PDF' : ICON.img + 'View screenshot') + '</button>';
  }).join('') + '</div>';
  return h;
}

function reportsSheet() {
  var fm = firstMonth(S.who);
  var h = '<div class="sh"><div><div class="t">Reports · ' + esc(S.who) + '</div><div class="s">Each month: money carried in, P&amp;L, money left. Tap a month for day-wise detail.</div></div>' + closeBtn() + '</div>';
  if (!fm) return h + '<span class="hint" style="font-size:14px;padding:6px 0 14px">No trades or funds yet.</span>';
  var rows = [], y = now0.getFullYear(), m = now0.getMonth();
  while (y > fm.y || (y === fm.y && m >= fm.m)) {
    var M = moneyFor(S.who, y, m);
    var wr = (M.green + M.red) ? Math.round(M.green / (M.green + M.red) * 100) + '%' : '—';
    rows.push('<button type="button" class="rrow" data-act="report" data-v="' + mkey(y, m) + '">' +
      '<span class="rl"><b>' + monthName(y, m) + '</b><span class="hint">' + M.trades.length + ' trades · ' + M.green + ' green / ' + M.red + ' red · win ' + wr + '</span></span>' +
      '<span class="rr"><span class="mono ' + col(M.net) + '" style="font-weight:700">' + money(M.net) + '</span><span class="hint mono">Left ' + (M.closing < 0 ? '−' : '') + inr(M.closing) + '</span></span></button>');
    m--; if (m < 0) { m = 11; y--; }
  }
  return h + '<div class="flist">' + rows.join('') + '</div>';
}
function reportSheet(k) {
  var y = Number(k.slice(0, 4)), m = Number(k.slice(5, 7)) - 1;
  var M = moneyFor(S.who, y, m);
  var pm = m ? m - 1 : 11, py = m ? y : y - 1;
  var h = '<div class="sh"><div><button type="button" class="linkbtn" data-act="reports">' + ICON.left + 'All months</button>' +
    '<div class="t">' + monthName(y, m) + ' · ' + esc(S.who) + '</div></div>' + closeBtn() + '</div>';
  h += '<div class="card" style="padding:12px 14px"><div class="mrows" style="border-top:0;padding-top:0">' +
    '<div class="mrow"><span>' + (M.hasBefore ? 'Carried from ' + MONTH[pm] + ' ' + py : 'Starting capital') + '</span><span class="mono">' + inr(M.opening) + '</span></div>' +
    '<div class="mrow"><span>Funds added</span><span class="mono g">' + (M.added ? '+' + inr(M.added) : '₹0') + '</span></div>' +
    '<div class="mrow"><span>Funds withdrawn</span><span class="mono' + (M.withdrawn ? ' r' : '') + '">' + (M.withdrawn ? '−' + inr(M.withdrawn) : '₹0') + '</span></div>' +
    '<div class="mrow"><span>Gross P&amp;L</span><span class="mono ' + col(M.gross) + '">' + money(M.gross) + '</span></div>' +
    '<div class="mrow"><span>Charges (brokerage, STT, GST…)</span><span class="mono r">−' + inr(M.charges) + '</span></div>' +
    '<div class="mrow"><span><b>Net P&amp;L</b> <span class="mhint">' + (M.base > 0 ? sgn(M.net) + Math.abs(M.pct).toFixed(2) + '%' : '') + '</span></span><span class="mono ' + col(M.net) + '">' + money(M.net) + '</span></div>' +
    '<div class="mrow total"><span>Money left at end</span><span class="mono">' + (M.closing < 0 ? '−' : '') + inr(M.closing) + '</span></div>' +
    '</div></div>';
  // day-wise
  var ev = {};
  M.trades.forEach(function (t) { var e = ev[t.trade_date] || (ev[t.trade_date] = { n: 0, gross: 0, ch: 0, fund: 0 }); e.n++; e.gross += num(t.pnl); e.ch += num(t.charges); });
  M.funds.forEach(function (f) { var e = ev[f.fund_date] || (ev[f.fund_date] = { n: 0, gross: 0, ch: 0, fund: 0 }); e.fund += num(f.amount); });
  var dates = Object.keys(ev).sort(), bal = M.opening;
  if (!dates.length) return h + '<span class="hint" style="font-size:14px">No trades this month.</span>';
  h += '<div class="dtab" role="table" aria-label="Day-wise P&amp;L"><div class="dh" role="row"><span role="columnheader">Day</span><span role="columnheader">Trades</span><span role="columnheader">Net P&amp;L</span><span role="columnheader">Balance</span></div>';
  dates.forEach(function (d) {
    var e = ev[d], n = e.gross - e.ch; bal += n + e.fund;
    h += '<button type="button" class="dr" role="row" data-act="repDay" data-date="' + d + '">' +
      '<span role="cell">' + fmtDay(d) + (e.fund ? '<span class="hint" style="display:block">' + (e.fund > 0 ? 'Added ' : 'Withdrew ') + inr(e.fund) + '</span>' : '') + '</span>' +
      '<span role="cell">' + (e.n || '—') + '</span>' +
      '<span role="cell" class="mono ' + (e.n ? col(n) : 'mu') + '">' + (e.n ? money(n) : '—') + '</span>' +
      '<span role="cell" class="mono">' + inr(bal) + '</span></button>';
  });
  h += '</div><button type="button" class="btn ghost" data-act="repCsv" data-v="' + k + '">' + ICON.pdf + 'Download this month (CSV)</button>';
  return h;
}
function downloadCsv(k) {
  var y = Number(k.slice(0, 4)), m = Number(k.slice(5, 7)) - 1, M = moneyFor(S.who, y, m);

document.addEventListener('drop', function (e) {
  if (!S.session || !e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
  e.preventDefault(); if (S.sheet && S.sheet.type === 'add') { S.sheet = null; $('overlay').innerHTML = ''; }
  handleIncomingFile(e.dataTransfer.files[0]);
});
$('fileSS').addEventListener('change', function () { var f = this.files && this.files[0]; if (f) startCheck('ss', f); });
$('fileFunds').addEventListener('change', function () { var f = this.files && this.files[0]; if (f && S.sheet && S.sheet.type === 'funds') readFundsFile(f); });
$('fileStmt').addEventListener('change', function () { var f = this.files && this.files[0]; if (f) startCheck('pdf', f, true); });
$('filePDF').addEventListener('change', function () { var f = this.files && this.files[0]; if (f) startCheck('pdf', f); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.sheet && S.sheet.type !== 'whoami' && !(S.check && S.check.saving)) closeSheet(); });

/* ---------------- login / start ---------------- */
function renderSetup(err) {
  $('main').innerHTML = '<form class="login" id="setupForm"><h1>P&amp;L Calendar</h1>' +
    '<span class="hint" style="font-size:14px">One-time setup. Copy these two from Supabase → <b>Project Settings → API</b>.</span>' +
    '<label class="f">Project URL<input class="in mono" id="c_url" placeholder="https://xxxx.supabase.co" autocomplete="off" required></label>' +
    '<label class="f">anon public key<input class="in mono" id="c_key" placeholder="eyJ..." autocomplete="off" required></label>' +
    (err ? '<span class="err">' + esc(err) + '</span>' : '') +
    '<button class="btn dark" type="submit">Continue</button>' +
    '<span class="hint">Chandana won\'t need this — you\'ll send her a setup link from ⚙ later.</span></form>';
  $('setupForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var u = $('c_url').value.trim().replace(/\/+$/, ''), k = $('c_key').value.trim();
    if (!/^https:\/\/.+/.test(u)) { renderSetup('The Project URL should start with https://'); return; }
    if (k.length < 20) { renderSetup('That key looks too short — copy the full "anon public" key.'); return; }
    try { localStorage.setItem(CONN_KEY, JSON.stringify({ u: u, k: k })); } catch (e2) { }
    location.reload();
  });
}
function setupLink() {
  var c = CONN || {};
  return location.origin + location.pathname + '#setup=' + encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify({ u: c.u, k: c.k })))));
}
async function shareSetup() {
  var link = setupLink();
  var text = 'Open this on your phone to set up our P&L Calendar, then sign in with your email and password:\n' + link;
  if (navigator.share) { try { await navigator.share({ title: 'P&L Calendar', text: text }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(link); toast('Setup link copied — send it to Chandana on WhatsApp'); }
  catch (e) { window.prompt('Copy this link and send it to Chandana:', link); }
}
function renderLogin(err) {
  $('overlay').innerHTML = '';
  $('main').innerHTML = '<form class="login" id="loginForm"><h1>P&amp;L Calendar</h1><span class="hint" style="font-size:14px">Sign in once on this phone. You\'ll stay signed in.</span>' +
    '<label class="f">Email<input class="in" type="email" id="l_email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>' +
    '<label class="f" for="l_pw">Password</label><div class="pwwrap" style="margin-top:-9px"><input class="in" type="password" id="l_pw" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>' +
    '<button type="button" class="eye" data-act="eye" aria-label="Show password">' + ICON.eye + '</button></div>' +
    (err ? '<span class="err">' + esc(err) + '</span>' : '') +
    '<button class="btn dark" type="submit" id="l_btn">Sign in</button></form>';
  $('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    $('l_btn').disabled = true; $('l_btn').textContent = 'Signing in…';
    var r = await sb.auth.signInWithPassword({ email: $('l_email').value.trim().toLowerCase(), password: $('l_pw').value });
    if (r.error) renderLogin(r.error.message === 'Invalid login credentials' ? 'Wrong email or password.' : r.error.message);
  });
}
function startApp(session) {
  S.session = session; S.email = session.user.email || '';
  var owner = lsGet('pnlcal.owner');
  if (!S.started) S.who = owner && PEOPLE.indexOf(owner) >= 0 ? owner : PEOPLE[0];
  S.started = true;
  loadCache(); render(); loadAll(); subscribe();
  if (!owner) openSheet({ type: 'whoami' });
}
async function init() {
  if (!sb) { renderSetup(); return; }
  sb.auth.onAuthStateChange(function (ev, session) {
    if (ev === 'SIGNED_OUT' || !session) {
      S.session = null; S.started = false;
      if (S.chan) { sb.removeChannel(S.chan); S.chan = null; }
      try { localStorage.removeItem(CACHE_KEY); } catch (e) { }
      S.trades = []; S.funds = []; S.settings = {}; S.uploads = {}; S.ai = { key: '', model: '' };
      renderLogin(); return;
    }
    if (ev === 'SIGNED_IN' && !S.started) startApp(session);
    else S.session = session;
  });
  var r = await sb.auth.getSession();
  if (r.data && r.data.session) { if (!S.started) startApp(r.data.session); }
  else if (!S.session) renderLogin();
}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () { });
init();
})();
</script>
</body>
</html>
